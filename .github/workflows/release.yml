name: Release

# Ablauf beim manuellen Start (workflow_dispatch):
#   1. „Version vorbereiten“ erhöht die Version in package.json, committet,
#      setzt den Tag `vX.Y.Z` und pusht Commit und Tag ausdrücklich.
#   2. „Release veröffentlichen“ läuft direkt danach im selben Lauf: Tests,
#      Build, und das Bundle wird an das GitHub-Release gehängt (HACS-Quelle).
#      Ein Tag-Push mit dem GITHUB_TOKEN startet keine weiteren Workflows –
#      deshalb wartet dieser Job hier nicht auf den Push-Auslöser.
#
# Ein von Hand gesetztes Tag (z. B. beim Anlegen eines Releases in der
# GitHub-Oberfläche) startet „Release veröffentlichen“ ebenfalls. Ein von
# Hand angelegtes Release bleibt erhalten; es bekommt nur die Dateien
# angehängt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neue Version (SemVer, ohne "v"), z. B. 1.2.0'
        required: true
        type: string
      prerelease:
        description: 'Als Vorabversion veröffentlichen'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  prepare:
    name: Version vorbereiten
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Version setzen und Bundle bauen
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Commit, Tag und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist
          # Kein Commit nötig, wenn sich nichts geändert hat (z. B. dieselbe Version).
          git diff --cached --quiet || git commit -m "chore: release v${{ inputs.version }}"
          git push origin main
          # Das Tag ausdrücklich pushen: `--follow-tags` überträgt nur annotierte
          # Tags, ein einfaches Tag bliebe sonst auf dem Runner liegen.
          TAG="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG existiert bereits – es wird nicht neu gesetzt."
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  publish:
    name: Release veröffentlichen
    needs: prepare
    # Beim manuellen Start nach „Version vorbereiten“, beim Push eines Tags
    # direkt (dann ist „prepare“ übersprungen).
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      ) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: GitHub-Release erstellen und Bundle anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wurde das Release schon von Hand angelegt (z. B. mit eigenem Text in
          # der GitHub-Oberfläche), werden die Dateien nur angehängt – Titel,
          # Text und Status bleiben unverändert. Sonst entsteht ein neues
          # Release mit automatisch erzeugten Notizen.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits – Bundle wird angehängt."
            gh release upload "$TAG" --clobber \
              dist/sun-moon-card.js \
              dist/sun-moon-card.js.map
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $( [ "$PRERELEASE" = "true" ] && echo --prerelease ) \
              dist/sun-moon-card.js \
              dist/sun-moon-card.js.map
          fi
