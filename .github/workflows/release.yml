name: Release

# Ablauf:
#   1. `Vorbereiten` (workflow_dispatch) erhöht die Version in package.json,
#      committet, setzt den Tag `vX.Y.Z` und pusht ihn.
#   2. Der Push des Tags startet `Veroeffentlichen`: Tests, Build und das
#      gebaute Bundle werden an das GitHub-Release gehängt (HACS-Quelle).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neue Version (SemVer, ohne "v"), z. B. 1.2.0'
        required: true
        type: string
      prerelease:
        description: 'Als Vorabversion veröffentlichen'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  prepare:
    name: Version vorbereiten
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Version setzen und Bundle bauen
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Commit, Tag und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin main --follow-tags

  publish:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: GitHub-Release erstellen und Bundle anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/sun-moon-card.js \
            dist/sun-moon-card.js.map
