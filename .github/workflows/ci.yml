name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typen, Lint, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee vitest-output.txt

      - name: Fehlerauszug veröffentlichen
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo '::error::Tests fehlgeschlagen – Auszug aus der Ausgabe:'
          grep -a -E 'FAIL|AssertionError|Error:|expected|Tests  ' vitest-output.txt \
            | head -25 \
            | while IFS= read -r line; do echo "::error::${line//'%'/%25}"; done

      - name: Build
        run: npm run build

      - name: Prüfen, ob das eingecheckte Bundle aktuell ist
        run: git diff --exit-code -- dist
